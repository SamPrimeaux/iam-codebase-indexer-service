# IAM-CODEBASE-INDEXER-SERVICE
# Cloudflare Worker name must be lowercase. Docs/tickets use IAM-CODEBASE-INDEXER-SERVICE.
name = "iam-codebase-indexer-service"
main = "worker/src/index.js"
compatibility_date = "2026-07-09"
compatibility_flags = ["nodejs_compat"]
# Binding-only from inneranimalmedia (IAM_CODEBASE_INDEXER). No public workers.dev host.
workers_dev = false

# Static CompiledWasm — workerd precompiles at deploy (no runtime byte instantiate).
[[rules]]
type = "CompiledWasm"
globs = ["**/*.wasm"]
fallthrough = true

[vars]
ENVIRONMENT = "production"
SERVICE_PRODUCT = "IAM-CODEBASE-INDEXER-SERVICE"

# Self-warm every 15m so main Worker need not call /warm on each index batch.
[triggers]
crons = ["*/15 * * * *"]

# Required in prod: same AGENTSAM_BRIDGE_KEY secret on this Worker + inneranimalmedia
# (service binding only — not exposed on a public URL). Put via:
# npx wrangler secret put AGENTSAM_BRIDGE_KEY -c wrangler.toml

[observability]
enabled = true
